<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="855" height="975" viewBox="200 140 855 975" role="img" aria-labelledby="title description">
  <title id="title">Floating Penguin in an Ice Hexagon</title>
  <desc id="description">A navy blue penguin floating on its back inside a pale blue ice hexagon. Recreated as editable vector paths, with a transparent background.</desc>
  <defs>
    <linearGradient id="navy" x1="220" y1="160" x2="1040" y2="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#002f6d" />
      <stop offset="1" stop-color="#003371" />
    </linearGradient>
    <linearGradient id="ice" x1="290" y1="240" x2="980" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#afe0fe" />
      <stop offset="0.55" stop-color="#acdefc" />
      <stop offset="1" stop-color="#afe1fc" />
    </linearGradient>
    <linearGradient id="belly" x1="425" y1="585" x2="770" y2="835" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfb" />
      <stop offset="1" stop-color="#f8f8f8" />
    </linearGradient>
  </defs>

  <g id="ice-hexagon" stroke="url(#navy)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
