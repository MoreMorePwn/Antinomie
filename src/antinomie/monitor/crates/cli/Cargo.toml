[package]
name = "antinomie-cli"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
description = "Antinomie command line: headless analysis and Auto mode"

[[bin]]
name = "antinomie-cli"
path = "src/main.rs"

[dependencies]
antinomie-monitor-core = { path = "../monitor-core" }
antinomie-service = { path = "../service" }
antinomie-triage = { path = "../triage" }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde.workspace = true
sha2 = "0.10"
# Result objects print their members in the order a command built them.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
# The scan fixtures (a recording with findings) for the triage and report tests.
antinomie-triage = { path = "../triage", features = ["test-support"] }
rustix = { version = "1", features = ["fs"] }
rusqlite = "0.41.0"
