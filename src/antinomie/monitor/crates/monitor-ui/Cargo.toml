[package]
name = "antinomie-monitor-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "antinomie-monitor"
path = "src/main.rs"

[dependencies]
antinomie-monitor-core = { path = "../monitor-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "persistence"] }
egui_extras = "0.31"
egui-phosphor = "0.9"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
