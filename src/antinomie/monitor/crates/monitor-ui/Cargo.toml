[package]
name = "antinomie-monitor-ui"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true

[[bin]]
name = "antinomie-monitor"
path = "src/main.rs"

[dependencies]
antinomie-monitor-core = { path = "../monitor-core" }
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "persistence"] }
egui_extras = "0.37"
egui_dock = { version = "=0.16.0", features = ["serde"] }
egui-phosphor = "0.9"
vt100 = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40.2", features = ["hooks"] }
rustix = { version = "1", features = ["fs", "process", "pty", "termios", "time"] }

[dev-dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[lints.clippy]
# Edition 2024 allows let chains, so clippy now asks for them. The crate is
# still written (and formatted, see rustfmt.toml) the 2021 way; migrate module
# by module rather than in one reformatting commit.
collapsible_if = "allow"
