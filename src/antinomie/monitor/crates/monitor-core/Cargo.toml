[package]
name = "antinomie-monitor-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
vt100 = "0.15"
rusqlite = "0.40.2"
x11rb = "0.13.2"
rustix = { version = "1", features = ["event", "net"] }

[build-dependencies]
cc = "1"
