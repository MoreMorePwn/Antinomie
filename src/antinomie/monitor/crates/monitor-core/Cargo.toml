[package]
name = "antinomie-monitor-core"
version.workspace = true
edition = "2024"
build = "build.rs"
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10.6"
sha1 = "0.10.7"
fuzzyhash = "0.2.2"
tlsh2 = "1.1.0"
vt100 = "0.16"
rusqlite = "0.40.2"
x11rb = "0.13.2"
rustix = { version = "1", features = ["event", "fs", "net", "process", "param"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
yara-x = "1.21.0"
zip = { version = "8.6", default-features = false, features = ["deflate", "aes-crypto"] }
flate2 = "1"
tar = "0.4"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
ext4-view = { version = "1.0.0", default-features = false, features = ["std"] }

[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }

# The conformance suite's checker logic has unit tests of its own.
[[example]]
name = "conformance"
path = "examples/conformance/main.rs"
test = true

[build-dependencies]
cc = "1"
