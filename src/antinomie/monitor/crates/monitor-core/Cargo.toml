[package]
name = "antinomie-monitor-core"
version.workspace = true
edition = "2024"
build = "build.rs"
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10.6"
sha1 = "0.10.7"
fuzzyhash = "0.2.2"
tlsh2 = { version = "1.1.0", features = ["diff"] }
vt100 = "0.16"
rusqlite = "0.41.0"
x11rb = "0.13.2"
rustix = { version = "1", features = ["event", "fs", "net", "process", "param"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
# aarch64 and 32-bit ARM (the debugger's code pane and the core view); x86 stays on iced-x86.
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm", "arch_arm64"] }
yara-x = "1.22.1"
regex = "1"
psl = "2"
zip = { version = "9.2", default-features = false, features = ["deflate", "aes-crypto"] }
flate2 = "1"
tar = "0.4"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
ext4-view = { version = "1.0.0", default-features = false, features = ["std"] }

[features]
# Entry points for the cargo-fuzz targets in ../../fuzz; not built by default.
fuzzing = []

[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }

# The conformance suite's checker logic has unit tests of its own.
[[example]]
name = "conformance"
path = "examples/conformance/main.rs"
test = true

# These two examples are VM tools with unit tests of their own; the tests run
# with the rest (the VM runs they drive do not).
[[example]]
name = "snapshot-check"
path = "examples/snapshot-check.rs"
test = true

[[example]]
name = "guest-run"
path = "examples/guest-run.rs"
test = true

[build-dependencies]
cc = "1"
