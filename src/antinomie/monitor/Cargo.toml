[workspace]
members = ["crates/monitor-core", "crates/monitor-ui", "crates/service", "crates/cli", "crates/triage"]
resolver = "2"

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["MikiMiku (MoreMorePwn)"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a number a client sent reads back as the same number after the
# service writes it again (a 73-digit integer in `overrides` did not).
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
