# Reviewed advisory applicability for the pinned host build. See
# docs/dependency-advisories.md for sources, enabled features and invalidation
# conditions. These entries do not claim that the dependencies are patched.
[advisories]
ignore = [
    # rsa: timing side channel in private-key decryption and signing; yara-x
    # only verifies Authenticode signatures with public keys.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (via elliptic-curve 0.13, p256/p384): timing variability
    # in operations on secret integers; fixed only in 0.7.6. yara-x uses p256 and
    # p384 VerifyingKeys to check signatures of scanned files, which handles no
    # secrets.
    "RUSTSEC-2026-0387",
    # wasmtime: component-model async lifting, hostcall fuel for record
    # lifting, type indices across engines and WASI filesystem paths. yara-x
    # runs core modules it compiles from the bundled rules, with one engine,
    # no components and no WASI; scanning runs inside the bubblewrap sandbox.
    "RUSTSEC-2026-0316",
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0327",
    "RUSTSEC-2026-0269",
    # Recursive Wasm types: no guest-supplied Wasm/compiled rules; YARA-X
    # builds core modules from its fixed type schema. No gc feature enabled.
    "RUSTSEC-2026-0359",
    # Cranelift aarch64 backend: the distributed host target is x86-64.
    "RUSTSEC-2026-0379",
    # Component-model async entrypoints and component handle tables: neither
    # component-model nor async is enabled in this Wasmtime dependency.
    "RUSTSEC-2026-0362",
    "RUSTSEC-2026-0363",
    # Borrowed resources transferred between components: a component-model
    # path, and the component model is not enabled.
    "RUSTSEC-2026-0424",
    # zip's extract()/stream-extract helpers are not called. Our two archive
    # readers iterate entries; rule imports reject symlinks and the tool
    # extractor validates links and masks mode bits before setting them.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
