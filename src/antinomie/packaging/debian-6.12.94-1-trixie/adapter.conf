# Adapter: Debian trixie, source package linux 6.12.94-1
#
# This file declares everything distro/version-specific. The kernel logic in
# src/antinomie/core/ is shared across adapters; this file is the thin layer
# that tells the scripts how to build the delta for this target.
#
# Adding a new distro or Debian release = a new folder next to this one with
# its own adapter.conf. See CONTRIBUTING.md ("Adding a new adapter").

DISTRO=debian
RELEASE=trixie
UPSTREAM_LINE=6.12

# Debian source package identity
SOURCE_VERSION=6.12.94-1
SOURCE_DIRNAME=linux-6.12.94
ABI_SUFFIX=+deb13
# The package's changelog date (SOURCE_DATE_EPOCH) and maintainer: Debian's
# build writes them into the kernel's build string (debian/rules.real), and
# scripts/build-monitor-kernel.sh writes the same.
SOURCE_DATE_EPOCH=1781938986
SOURCE_MAINTAINER=debian-kernel@lists.debian.org
# The banner (linux_banner, /proc/version with the release and build string)
# of Debian's own build of this package: /boot/vmlinuz-6.12.94+deb13-amd64 of
# linux-image-6.12.94+deb13-amd64 6.12.94-1 (the package
# scripts/build-debian-image.py pins). A Debian Minimal kernel must carry it
# exactly, which takes Debian 13's compiler and linker (gcc-14 14.2.0-19,
# binutils 2.44).
KERNEL_BANNER='Linux version 6.12.94+deb13-amd64 (debian-kernel@lists.debian.org) (x86_64-linux-gnu-gcc-14 (Debian 14.2.0-19) 14.2.0, GNU ld (GNU Binutils for Debian) 2.44) #1 SMP PREEMPT_DYNAMIC Debian 6.12.94-1 (2026-06-20)'

# Pinned inputs (paths relative to the repo root) and their hashes
INPUT_DSC=src/debian/linux_6.12.94-1.dsc
INPUT_ORIG=src/debian/linux_6.12.94.orig.tar.xz
INPUT_DEBTAR=src/debian/linux_6.12.94-1.debian.tar.xz
INPUT_SHA_ORIG=3eea3dd18f67a103f6f8312e314075f695a27eaddd839e7b6c4641e6616dabba
INPUT_SHA_DEBTAR=8c5130fd9dee8d6efcc594dc3357809ad8e0d0234357139f85f5ed39b37922b4

# Where the Antinomie series is inserted in the Debian packaging
PATCH_DIR=debian/patches
SERIES_FILE=debian/patches/series
FENCE_MARKER='# --- Antinomie project delta (maintained under debian/patches/antinomie/) ---'

# Adapter-specific commands
CONFIG_REFRESH="debian/bin/kconfig.py --refresh"
BUILD_CMD='DEB_BUILD_OPTIONS=parallel=$(nproc) dpkg-buildpackage -b -uc -us'
TEST_CMD='debian/bin/test-patches -f amd64 -s none -j "$(nproc)"'
