# The BusyBox camera base's own symbols (scripts/build-monitor-kernel.sh, profile
# extra), on top of the minimal profile's, for every architecture: NAME enables
# it built in, !NAME turns it off, NAME=VALUE sets a number.
# A watchdog device: softdog is /dev/watchdog. No hardware watchdog of QEMU's
# (q35's TCO, i6300esb) is built in: those reset the VM when they fire.
WATCHDOG WATCHDOG_CORE SOFT_WATCHDOG !WATCHDOG_NOWAYOUT !ITCO_WDT !I6300ESB_WDT
# Flash: a RAM disk the base hands to block2mtd at boot, named and split into
# partitions by the mtdparts= option of its command line (/proc/mtd, /dev/mtdN,
# /dev/mtdblockN), with jffs2 for the settings partition as on the devices.
# No physmap: arm64's defconfig maps QEMU virt's 128 MiB firmware flash as
# mtd0 "0.flash", which no camera has.
MTD MTD_BLOCK MTD_CMDLINE_PARTS MTD_BLOCK2MTD !MTD_PARTITIONED_MASTER JFFS2_FS
!MTD_PHYSMAP
BLK_DEV_RAM BLK_DEV_RAM_COUNT=1 BLK_DEV_RAM_SIZE=16384
# iptables (the legacy tables the devices' firmware uses) with NAT and the
# matches and targets bots name: drop or reject a port, redirect it, log it.
NETFILTER_ADVANCED NETFILTER_XTABLES NF_CONNTRACK NF_NAT IP_NF_IPTABLES IP_NF_FILTER
IP_NF_MANGLE IP_NF_NAT IP_NF_TARGET_MASQUERADE IP_NF_TARGET_REDIRECT IP_NF_TARGET_REJECT
NETFILTER_XT_NAT NETFILTER_XT_TARGET_LOG NETFILTER_XT_MATCH_MULTIPORT
NETFILTER_XT_MATCH_STATE NETFILTER_XT_MATCH_CONNTRACK NETFILTER_XT_MATCH_LIMIT
NETFILTER_XT_MATCH_COMMENT
