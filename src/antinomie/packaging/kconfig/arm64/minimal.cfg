# arm64's own symbols of the minimal kernel profile (scripts/build-monitor-kernel.sh
# enables each, built in; !NAME turns one off), on top of arm64's defconfig and
# the shared list.
# QEMU virt: PL011 serial console, PL031 clock, the generic ECAM PCIe host and
# virtio-mmio slots.
SERIAL_AMBA_PL011 SERIAL_AMBA_PL011_CONSOLE RTC_DRV_PL031
PCI PCI_HOST_GENERIC VIRTIO_MMIO
# The network cards a device profile offers besides virtio and Intel's (built in
# by the defconfig): Realtek RTL8139.
NET_VENDOR_REALTEK 8139CP 8139TOO
# UEFI boot (AAVMF) with ACPI, as server and cloud profiles start.
EFI EFI_STUB ACPI
# AArch32 programs (compat), hardware breakpoints and watchpoints for the debugger.
COMPAT HW_PERF_EVENTS
# A process core keeps the first page of each unmodified ELF mapping (its
# headers, the build ID and the code in it), as Debian and x86_64_defconfig
# have it; arm64's defconfig turns it off, which left a crash at the start of
# the program's text without code in the core view.
CORE_DUMP_DEFAULT_ELF_HEADERS
# IPv6, built in as Debian has it (arm64's defconfig makes it a module, which
# the minimal profile leaves out; nftables' inet family needs it).
IPV6
# Netfilter's iptables interface as x86-64's defconfig builds it in (arm64's
# makes modules): the legacy tables, conntrack and its match.
NF_CONNTRACK NETFILTER_XT_MATCH_CONNTRACK IP_NF_IPTABLES IP_NF_FILTER IP_NF_MANGLE
IP_NF_TARGET_REJECT IP6_NF_IPTABLES IP6_NF_FILTER IP6_NF_MANGLE IP6_NF_TARGET_REJECT
# Voluntary preemption as Debian's arm64 kernel (its banner says SMP, not
# SMP PREEMPT).
PREEMPT_VOLUNTARY !PREEMPT
# No transparent huge pages, as x86_64_defconfig (arm64's has them always): a
# sparse heap stays sparse, and so does its process core.
!TRANSPARENT_HUGEPAGE
# Tracing as Debian and x86_64_defconfig have it: BPF_LSM needs BPF_EVENTS.
FTRACE KPROBES KPROBE_EVENTS UPROBE_EVENTS BPF_EVENTS
# No KVM: under TCG the guest boots at EL1 and KVM's init line ("HYP mode not
# available") names it; the server and workstation profiles' real machines
# would boot at EL2 instead.
!KVM
