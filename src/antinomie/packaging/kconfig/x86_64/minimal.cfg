# x86-64's own symbols of the minimal kernel profile (scripts/build-monitor-kernel.sh
# enables each, built in), on top of x86_64_defconfig and the shared list.
# q35/i440FX consoles and input: VGA text console, 16550 serial, PS/2.
VGA_CONSOLE SERIAL_8250 SERIAL_8250_CONSOLE
KEYBOARD_ATKBD MOUSE_PS2 SERIO SERIO_I8042
# The PC CMOS clock and QEMU's standard VGA (bochs) display.
RTC_DRV_CMOS DRM_BOCHS
