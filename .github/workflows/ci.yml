# Checks for every push and pull request: privacy, formatting, lints, the
# Rust and build-script tests, and shell scripts.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages
        run: |
          sudo apt-get update
          printf '%s\n' 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libsqlite3-dev libxkbcommon-dev libwayland-dev \
            qemu-system-x86 qemu-utils shellcheck file tshark bubblewrap util-linux musl-tools \
            debian-archive-keyring \
            python3-venv qpdf poppler-utils mupdf-tools libxml2-utils p7zip-full
      - name: Packet decoder sandbox prerequisites
        run: |
          packet_sandbox() {
            prlimit --as=2147483648 --core=0 --nofile=128 -- \
              bwrap --unshare-all --unshare-user --disable-userns --uid 65534 --gid 65534 \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
              --symlink usr/lib64 /lib64 --proc /proc --dev /dev \
              --cap-drop ALL --die-with-parent --new-session -- \
              /bin/sh -c 'test "$(id -u)" -eq 65534 && tshark --version'
          }
          if ! packet_sandbox; then
            # Ubuntu 24.04 may deny capabilities in unconfined user namespaces.
            # Adjust only this disposable runner's per-boot restriction, if needed.
            restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
            if [[ ! -r "$restriction" ]] || [[ "$(cat "$restriction")" -eq 0 ]]; then
              echo 'Packet decoder sandbox failed without an enabled AppArmor userns restriction.' >&2
              exit 1
            fi
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            packet_sandbox
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/antinomie/monitor
      - name: No machine-specific paths
        run: scripts/check-privacy.sh
      - name: Module sizes
        run: python3 -I scripts/check-module-size.py
      - name: Formatting
        working-directory: src/antinomie/monitor
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src/antinomie/monitor
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Build the app (the restart test reads disks with its sandboxed reader)
        working-directory: src/antinomie/monitor
        run: cargo build --release --locked -p antinomie-monitor-ui
      - name: Tests
        working-directory: src/antinomie/monitor
        run: cargo test --release --locked --no-fail-fast
      - name: License boundaries and locked dependencies
        run: |
          python3 tests/monitor/test-licenses.py
          python3 scripts/check-licenses.py
      - name: Build-script tests
        run: |
          python3 tests/monitor/test-guest-resources.py
          python3 tests/monitor/test-build-base.py
          python3 tests/monitor/test-debian-image.py
          python3 tests/monitor/test-native-coverage.py
          python3 tests/monitor/test-sinkhole.py
          python3 tests/monitor/test-evasive-sample.py
          python3 tests/monitor/test-vm-regress.py
          python3 tests/monitor/test-sync-quilt-view.py
          python3 tests/monitor/test-kernel-btf.py
          python3 tests/monitor/test-kernel-abi.py
          python3 scripts/test-refresh-monitor-bundle.py
          python3 scripts/test-full-pack.py
      - name: Sigma adapter tests (with the locked pySigma)
        # The adapter tests skip themselves without pySigma, so install the
        # exact set the app installs for users, hashes checked.
        run: |
          python3 -m venv "$RUNNER_TEMP/sigma"
          "$RUNNER_TEMP/sigma/bin/pip" install --require-hashes --only-binary=:all: --no-deps \
            -r src/antinomie/monitor/crates/monitor-core/assets/sigma-requirements.txt
          "$RUNNER_TEMP/sigma/bin/python" tests/monitor/test-sigma-adapter.py
      - name: Report exports checked with outside tools
        # Skips a validator that is not installed; the fixture tests it
        # drives need the Rust build above.
        run: |
          python3 -m venv "$RUNNER_TEMP/report"
          "$RUNNER_TEMP/report/bin/pip" install --quiet jsonschema stix2 stix2-patterns
          "$RUNNER_TEMP/report/bin/python" tests/monitor/test-report-export.py
      - name: Behaviour samples carry no product name
        run: tests/monitor/check-sample-branding.sh
      - name: Shell scripts
        run: |
          shellcheck --severity=error install.sh run.sh scripts/*.sh tests/monitor/*.sh \
            tests/monitor/conformance/*.sh src/debian/debian/bin/*.sh \
            src/antinomie/monitor/crates/monitor-core/src/guest_desktop.sh \
            src/antinomie/monitor/crates/monitor-core/src/guest_account/boot_loader.sh

  audit:
    # Advisories in dependencies. A new one fails the job; the reviewed ones
    # (each with its reason) are listed in src/antinomie/monitor/.cargo/audit.toml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src/antinomie/monitor
        run: cargo audit
