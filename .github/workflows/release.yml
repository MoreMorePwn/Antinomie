# Release on a version tag (vX.Y.Z): the tag must match the workspace
# version. The build job runs CI's checks with read-only access and builds the
# archive with scripts/build-release.sh; only the publish job may write, and
# it adds a build provenance attestation and short notes that link the
# version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System packages
        run: |
          sudo apt-get update
          printf '%s\n' 'wireshark-common wireshark-common/install-setuid boolean false' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            musl-tools pkg-config libsqlite3-dev libxkbcommon-dev libwayland-dev \
            qemu-system-x86 qemu-utils tshark bubblewrap util-linux
      - name: Packet decoder sandbox prerequisites
        run: |
          packet_sandbox() {
            prlimit --as=2147483648 --core=0 --nofile=128 -- \
              bwrap --unshare-all --unshare-user --disable-userns --uid 65534 --gid 65534 \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
              --symlink usr/lib64 /lib64 --proc /proc --dev /dev \
              --cap-drop ALL --die-with-parent --new-session -- \
              /bin/sh -c 'test "$(id -u)" -eq 65534 && tshark --version'
          }
          if ! packet_sandbox; then
            # Ubuntu 24.04 may deny capabilities in unconfined user namespaces.
            # Adjust only this disposable runner's per-boot restriction, if needed.
            restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
            if [[ ! -r "$restriction" ]] || [[ "$(cat "$restriction")" -eq 0 ]]; then
              echo 'Packet decoder sandbox failed without an enabled AppArmor userns restriction.' >&2
              exit 1
            fi
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            packet_sandbox
          fi
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Tag matches the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/antinomie/monitor/Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match workspace version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: No machine-specific paths
        run: scripts/check-privacy.sh
      - name: Module sizes
        run: python3 -I scripts/check-module-size.py
      - name: Formatting
        working-directory: src/antinomie/monitor
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src/antinomie/monitor
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        working-directory: src/antinomie/monitor
        run: cargo test --release --locked
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src/antinomie/monitor
        run: cargo audit
      - name: Build the release archive
        run: scripts/build-release.sh dist
      - name: Release notes
        run: |
          grep -q "^## $VERSION " CHANGELOG.md || {
            echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          # The first paragraph of the version's CHANGELOG section, then a link to all of it.
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " {on = 1; next}
            on && (/^#/ || (started && /^$/) || (!started && /^[-*] /)) {exit}
            on && NF {started = 1; print}' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "Full list of changes: [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo
            echo 'Linux x86-64 archive: extract it and run `./install.sh` to install or update for the current user, or run `./antinomie-monitor` directly. See the included README for requirements and notices, and [SECURITY.md](https://github.com/'"$GITHUB_REPOSITORY"'/blob/main/SECURITY.md) to report a vulnerability.'
            echo
            echo "SHA-256 (\`antinomie-$VERSION-linux-x86_64.tar.gz\`):"
            echo '```'
            cut -d' ' -f1 dist/SHA256SUMS
            echo '```'
            echo
            echo 'Verify the archive and its build provenance:'
            echo '```sh'
            echo 'sha256sum --check SHA256SUMS'
            echo "gh attestation verify antinomie-$VERSION-linux-x86_64.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/antinomie-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Checksums still match
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/antinomie-${{ needs.build.outputs.version }}-linux-x86_64.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/antinomie-$VERSION-linux-x86_64.tar.gz" dist/SHA256SUMS --verify-tag
          --repo "$GITHUB_REPOSITORY"
          --title "Antinomie $VERSION" --notes-file dist/notes.md
